[package]
name = "poke-rips"
version = "0.1.0"
description = "Poke Rips - Solana pack ripping program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "poke_rips"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"

# Pin pre-edition2024 crates so CI cargo metadata works
block-buffer = "=0.10.4"
crypto-common = "=0.1.6"
